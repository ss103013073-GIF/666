<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>羽球分組</title>
<meta name="theme-color" content="#0f1419">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="羽球分組">
<style>
:root { --bg:#0f1419; --card:#1a2332; --accent:#3b82f6; --text:#e2e8f0; --text-dim:#94a3b8; --border:#334155; }
* { box-sizing:border-box; margin:0; padding:0; }
body { font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif; background:var(--bg); color:var(--text); padding:16px; max-width:900px; margin:0 auto; line-height:1.6; }
h1 { font-size:1.6rem; margin-bottom:8px; }
.hidden { display:none !important; }
.card { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:16px; margin-bottom:16px; }
h2 { font-size:1.1rem; margin-bottom:12px; }
h3 { font-size:1rem; margin:12px 0 8px; color:#cbd5e1; }
input, select, button, textarea { font-family:inherit; font-size:1rem; }
input, select, textarea { width:100%; background:#0f172a; border:1px solid var(--border); color:var(--text); border-radius:8px; padding:10px 12px; margin-bottom:10px; }
button { background:var(--accent); color:#fff; border:none; border-radius:8px; padding:10px 16px; cursor:pointer; font-weight:500; }
button.secondary { background:#334155; }
button.small { padding:6px 10px; font-size:0.85rem; }
.weekday-btns { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:12px; }
.weekday-btns button { flex:1; min-width:50px; padding:8px; background:#1e293b; }
.weekday-btns button.active { background:var(--accent); }
.groups-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(140px, 1fr)); gap:8px; }
.tag { background:#334155; padding:6px 10px; border-radius:20px; font-size:0.9rem; }
.remove { cursor:pointer; margin-left:6px; color:#ef4444; }
.mode-switch { display:flex; gap:8px; margin-bottom:12px; }
.mode-switch button { flex:1; background:#1e293b; }
.mode-switch button.active { background:var(--accent); }
.row { display:flex; gap:8px; flex-wrap:wrap; }
.row > * { flex:1; min-width:120px; }
.tap-area { background:#1e293b; border-radius:12px; padding:40px 20px; text-align:center; cursor:pointer; margin:16px 0; }
.big-group { font-size:3rem; font-weight:bold; }
</style>
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#0f172a"><link rel="apple-touch-icon" href="icon-192.png"></head>
<body>
<h1>羽球分組</h1>
<div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;">
  <p style="color:var(--text-dim); margin:0;">選擇功能開始</p>
  <button id="menuBtn" onclick="toggleMenu()" style="background:none; border:none; color:#fff; font-size:1.6rem;">☰</button>
</div>

<div id="sideMenu" class="hidden" style="background:#1a2332; border:1px solid var(--border); border-radius:12px; padding:12px; margin-bottom:16px;">
  <button onclick="switchMenu('home')" style="display:block; width:100%; text-align:left; margin-bottom:8px; background:#334155;">首頁</button>
  <button onclick="switchMenu('group')" style="display:block; width:100%; text-align:left; margin-bottom:8px; background:#334155;">分組</button>
  <button onclick="switchMenu('racket')" style="display:block; width:100%; text-align:left; background:#334155;">自己</button>
</div>

<!-- Home -->
<div id="menu-home">
  <div class="card">
    <h2>歡迎使用羽球分組</h2>
    <p>點右上角 ☰ 選擇功能</p>
  </div>
  <div style="margin-top:24px; text-align:center;">
    <p id="appVersionLabel" style="font-size:0.85rem; color:var(--text-dim); margin-bottom:8px;">版本 v1.3.5</p>
    <button class="secondary" onclick="checkUpdate()" style="width:100%;">檢查更新</button>
  </div>
</div>

<!-- Group -->
<div id="menu-group" class="hidden">
  <div style="margin-bottom:12px;">
    <label>日期</label>
    <input type="date" id="groupDate">
  </div>
  <div style="margin-bottom:12px;">
    <button class="secondary" onclick="toggleRosterPanel()" style="width:100%;">成員</button>
  </div>
  <div id="rosterPanel" class="card hidden">
    <h2>成員名單</h2>
    <label>名單名稱</label>
    <input type="text" id="rosterNameInput" placeholder="例如：週三固定">
    <label>名單內容（一行一個名字，可用 名字,男,8 或 名字,女）</label>
    <textarea id="rosterTextInput" rows="6" placeholder="小明,男,10&#10;小華,女,8&#10;阿強"></textarea>
    <div class="row" style="gap:8px; margin-top:8px;">
      <button onclick="saveRoster()">存成名單</button>
      <button class="secondary" onclick="updateRoster()">更新目前編輯</button>
      <button class="secondary small" onclick="importFromPeople()">帶入目前手動名單</button>
    </div>
    <p id="rosterEditHint" style="font-size:0.85rem; color:var(--accent); margin-top:8px;"></p>
    <h3 style="margin-top:12px;">已存名單（點載入）</h3>
    <div id="rosterList"></div>
  </div>
  <div class="mode-switch">
    <button id="btnManual" class="active" onclick="switchMode('manual')">手動輸入</button>
    <button id="btnQuick" onclick="switchMode('quick')">快速分組</button>
    <button id="btnRotate" onclick="switchMode('rotate')">單人輪轉</button>
    <button id="btnCover" onclick="switchMode('cover')">全覆蓋</button>
  </div>

  <div id="mode-manual">
    <div class="card">
      <h2>1. 人員名單</h2>
      <label>載入已存名單</label>
      <select id="manualRosterSelect" onchange="applyRosterToManual(this.value)">
        <option value="">選擇名單…</option>
      </select>
      <div class="row">
        <input type="text" id="nameInput" placeholder="輸入姓名後按 Enter 或點新增">
        <select id="genderInput" style="flex:0 0 100px;">
          <option value="">性別</option>
          <option value="男">男</option>
          <option value="女">女</option>
        </select>
      </div>
      <div class="row" style="margin-top:8px; align-items:center; gap:8px;">
        <input type="checkbox" id="useAbility" onchange="const s=document.getElementById('abilityInput'); s.disabled=!this.checked; s.style.opacity=this.checked?1:0.5;" style="flex:0 0 auto;">
        <span style="font-size:0.9rem; flex:0 0 auto;">等級</span>
        <select id="abilityInput" style="flex:0 0 110px; opacity:0.5;" disabled>
          <option value="">選擇</option>
          <option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option>
          <option value="5">5</option><option value="6">6</option><option value="7">7</option><option value="8">8</option>
          <option value="9">9</option><option value="10">10</option><option value="11">11</option><option value="12">12</option>
          <option value="13">13</option><option value="14">14</option><option value="15">15</option><option value="16">16</option>
        </select>
        <button onclick="addPerson()" style="flex:0 0 auto; margin-left:auto;">新增</button>
      </div>
      <div id="peopleList" class="people-list" style="margin-top:8px;"></div>
      <div class="row" style="margin-top:8px;">
        <button type="button" class="secondary small" id="btnClearPeople" onclick="clearPeople(event)">清空名單</button>
        <button class="secondary small" onclick="loadSample()">載入範例</button>
      </div>
    </div>

    <div class="card">
      <h2>2. 分組設定</h2>
      <div class="row">
        <div style="flex:1;"><label>分成幾組</label><input type="number" id="numGroups" placeholder="例如 3" min="1" value="3"></div>
        <div style="flex:1;"><label>每組幾人</label><input type="number" id="peoplePerGroup" placeholder="例如 2" min="2" value="2"></div>
      </div>
      <div style="margin-top:8px;">
        <label>一次要分幾輪（輪次）</label>
        <input type="number" id="numRounds" placeholder="例如 3" min="1" value="1">
      </div>
    </div>

    <div class="card">
      <h2>3. 特殊限制</h2>
      <h3>不能同組（硬限制）</h3>
      <div class="row">
        <select id="cannotA"></select>
        <select id="cannotB"></select>
        <button onclick="addCannot()" style="flex:0 0 auto;">新增</button>
      </div>
      <div id="cannotList" class="constraints"></div>

      <h3 style="margin-top:12px;">希望同組</h3>
      <div class="row">
        <select id="hopeA"></select>
        <select id="hopeB"></select>
        <button onclick="addHope()" style="flex:0 0 auto;">新增</button>
      </div>
      <div id="hopeList" class="constraints"></div>

      <div style="margin:16px 0 8px; display:flex; align-items:center; gap:10px; flex-wrap:nowrap;">
        <input type="checkbox" id="noFemalePair" style="flex:0 0 auto; width:20px; height:20px;">
        <span style="white-space:normal; writing-mode:horizontal-tb;">勾選後避免兩位女性同組</span>
      </div>

      <div style="margin:8px 0; display:flex; align-items:center; gap:10px; flex-wrap:nowrap;">
        <input type="checkbox" id="memoryMode" onchange="toggleMemory()" style="flex:0 0 auto; width:20px; height:20px;">
        <span style="white-space:normal; writing-mode:horizontal-tb;">同組過不能再同組</span>
      </div>
      <div id="memoryInfo" style="font-size:0.85rem; color:var(--accent); margin:4px 0 8px 30px; min-height:1.2em;"></div>

      <div style="margin:8px 0; display:flex; align-items:center; gap:10px; flex-wrap:nowrap;">
        <input type="checkbox" id="balanceLevel" style="flex:0 0 auto; width:20px; height:20px;">
        <span style="white-space:normal; writing-mode:horizontal-tb;">等級平衡（每組平均等級接近）</span>
      </div>
    </div>

    <div class="card">
      <h2>4. 分組結果</h2>
      <div class="row">
        <button onclick="generate()">開始分組</button>
        <button class="secondary" onclick="generateAgain()">再分一次</button>
        <button class="secondary" onclick="showManualResultEditor()">手動填寫結果</button>
      </div>
      <div id="result" style="margin-top:12px;"></div>
      <div id="manualFirstArea" style="margin-top:8px;"></div>
      <div class="row" style="margin-top:8px;">
        <button class="secondary small" onclick="clearResult()">清除結果</button>
        <button class="secondary small" onclick="saveManualToHistory()">儲存本次到歷史</button>
      </div>
    </div>

    <div class="card">
      <h2>5. 歷史紀錄</h2>
      <div id="manualHistory"></div>
      
    </div>
  </div>

  <div id="mode-quick" class="hidden">
    <div class="card" id="quickSetup">
      <h2>快速分組</h2>
      <div class="row">
        <div><label>總人數</label><input type="number" id="quickTotal" value="6" min="2"></div>
        <div><label>每組幾人</label><input type="number" id="quickPerGroup" value="2" min="2"></div>
      </div>
      <button onclick="startQuick()">開始</button>
    </div>
    <div class="card hidden" id="quickReveal">
      <div id="curtainArea" style="position:relative; height:200px; background:#1e293b; border-radius:12px; overflow:hidden; margin:16px 0;">
        <div id="groupDisplay" style="position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; visibility:hidden;">
          <div class="big-group" id="quickGroup" style="font-size:3rem; font-weight:bold;">A</div>
          <div id="quickHint" style="margin-top:8px;">組</div>
        </div>
        <div id="curtain" style="position:absolute; inset:0; background:#1e293b; display:flex; align-items:center; justify-content:center; font-size:1.2rem; color:var(--text-dim); cursor:pointer; z-index:2;" onclick="pullCurtain()">
          點一下確認組別
        </div>
      </div>
      <div id="confirmArea" class="hidden" style="text-align:center; margin-top:12px;">
        <button onclick="confirmNext()">確認並下一個</button>
      </div>
      <div id="quickStatus" style="text-align:center; color:var(--text-dim); margin-top:8px;"></div>
      <button class="secondary" onclick="resetQuick()" style="margin-top:12px;">重新開始</button>
    </div>
  </div>

  <div id="mode-rotate" class="hidden">
    <div class="card">
      <h2>單人輪轉</h2>
      <div class="row">
        <input type="text" id="rName" placeholder="姓名" style="flex:1;">
        <select id="rGender" style="flex:0 0 110px;">
          <option value="">性別</option>
          <option value="男">男</option>
          <option value="女">女</option>
        </select>
      </div>
      <div class="row" style="margin-top:8px; align-items:center; gap:8px;">
        <input type="checkbox" id="useRotateLevel" onchange="const s=document.getElementById('rLevel'); s.disabled=!this.checked; s.style.opacity=this.checked?1:0.5;" style="flex:0 0 auto;">
        <span style="font-size:0.9rem; flex:0 0 auto;">等級</span>
        <select id="rLevel" style="flex:0 0 110px; opacity:0.5;" disabled>
          <option value="">選擇</option>
          <option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option>
          <option value="5">5</option><option value="6">6</option><option value="7">7</option><option value="8">8</option>
          <option value="9">9</option><option value="10">10</option><option value="11">11</option><option value="12">12</option>
          <option value="13">13</option><option value="14">14</option><option value="15">15</option><option value="16">16</option>
        </select>
        <button onclick="addRotatePerson()" style="flex:0 0 auto; margin-left:auto;">新增</button>
      </div>
      <div id="rotatePeopleList" class="people-list"></div>
      <div class="row" style="margin-top:8px;">
        <div><label>分成幾組</label><input type="number" id="rGroups" value="3" min="1"></div>
      </div>
      <div class="row">
        <button onclick="confirmRotate()">確認分組</button>
        <button class="secondary" onclick="showManualRotateEditor()">手動填寫分組</button>
      </div>
      <div id="rotateResult" style="margin-top:12px;"></div>
      <div class="row" style="margin-top:12px;">
        <button onclick="doRotate('cw')">順時鐘</button>
        <button onclick="doRotate('ccw')">逆時鐘</button>
      </div>
      <div id="rotateFirst" style="margin-top:8px;"></div>
      <div class="card" style="margin-top:12px;">
        <h3>單人輪轉紀錄</h3>
        <div id="rotateHistoryList"></div>
      </div>
    </div>
  </div>
  <div class="card hidden" id="coverCard">
    <h2>全覆蓋輪轉</h2>
    <label>載入已存名單</label>
    <select id="coverRosterSelect" onchange="onCoverRosterChange()">
      <option value="">選擇名單…</option>
    </select>
    <div class="row" style="margin-top:8px; gap:8px;">
      <input type="text" id="coverNameInput" placeholder="手動新增姓名" style="flex:1; margin-bottom:0;">
      <button type="button" onclick="addCoverPerson()" style="flex:0 0 auto;">新增</button>
    </div>
    <div id="coverPeopleList" class="people-list" style="margin-top:8px;"></div>
    <div class="row" style="margin-top:8px;">
      <button type="button" class="secondary small" onclick="clearCoverPeople()">清空人員</button>
    </div>
    <div class="row" style="margin-top:8px;">
      <div style="flex:1;"><label>使用幾人（全覆蓋）</label>
        <select id="coverCount">
          <option value="6">6人</option>
          <option value="7">7人</option>
          <option value="8">8人</option>
          <option value="9">9人</option>
          <option value="10">10人</option>
        </select>
      </div>
    </div>
    <p id="coverRosterHint" style="font-size:0.85rem; color:var(--text-dim); margin:8px 0;">可載入名單或手動一個一個新增，第一輪會隨機分組</p>
    <button onclick="startCover()" style="margin-top:8px;">開始</button>
    <div id="coverResult" style="margin-top:12px;"></div>
    <div class="row" style="margin-top:8px;">
      <button onclick="nextCover()">下一輪</button>
      <button onclick="prevCover()">上一輪</button>
    </div>
    <div id="coverProgress" style="margin-top:8px; color:var(--accent);"></div>
    <div id="coverPartners" style="margin-top:12px;"></div>
    <div class="card" style="margin-top:12px;">
      <h3>全覆蓋紀錄</h3>
      <div id="coverHistoryList"></div>
    </div>
  </div>
  <div class="card" id="quickHistoryCard" style="display:none;">
    <h2>快速分組紀錄</h2>
    <div id="quickHistoryList"></div>
  </div>
  <div class="card">
    <h2>手動分組紀錄</h2>
    <div id="historyList"></div>
  </div>
</div>

<!-- Racket -->
<div id="menu-racket" class="hidden">
  <div class="card">
    <h2>我的球拍</h2>
    <input type="text" id="racketName" placeholder="球拍名稱">
    <div class="row">
      <div>
        <label>規格（重量）</label>
        <select id="racketWeight">
          <option value="">選擇</option>
          <option value="3U">3U</option>
          <option value="4U">4U</option>
          <option value="5U">5U</option>
          <option value="6U">6U</option>
        </select>
      </div>
      <div>
        <label>規格（握把）</label>
        <select id="racketGrip">
          <option value="">選擇</option>
          <option value="G2">G2</option>
          <option value="G3">G3</option>
          <option value="G4">G4</option>
          <option value="G5">G5</option>
          <option value="G6">G6</option>
        </select>
      </div>
    </div>
    <button onclick="addRacket()">新增球拍</button>
    <div id="racketList" style="margin-top:12px;"></div>
  </div>
</div>

<script>
let historyRecords = [];
let quickHistory = [];
let rotateHistory = [];

function loadAllHistories() {
  try { historyRecords = JSON.parse(localStorage.getItem("historyRecords") || "[]"); } catch(e) { historyRecords = []; }
  try { quickHistory = JSON.parse(localStorage.getItem("quickHistory") || "[]"); } catch(e) { quickHistory = []; }
  try { rotateHistory = JSON.parse(localStorage.getItem("rotateHistory") || "[]"); } catch(e) { rotateHistory = []; }
  try { manualHistory = JSON.parse(localStorage.getItem("manualHistory") || "[]"); } catch(e) { manualHistory = []; }
  try { coverHistory = JSON.parse(localStorage.getItem("coverHistory") || "[]"); } catch(e) { coverHistory = []; }
  window.quickHistory = quickHistory;
  window.rotateHistory = rotateHistory;
}

function persistHistory(key, arr) {
  try { localStorage.setItem(key, JSON.stringify(arr)); } catch(e) {}
}

function saveHistory(type, groups, firstMatch) {
  const date = document.getElementById("groupDate")?.value || new Date().toISOString().slice(0,10);
  const day = selectedDay || "";
  const record = { date, day, type, groups, firstMatch: firstMatch || "", time: Date.now() };
  if (type === "快速分組") {
    quickHistory.unshift(record);
    if (quickHistory.length > 30) quickHistory.pop();
    window.quickHistory = quickHistory;
    persistHistory("quickHistory", quickHistory);
    renderQuickHistory();
  } else if (type === "單人輪轉") {
    rotateHistory.unshift(record);
    if (rotateHistory.length > 30) rotateHistory.pop();
    window.rotateHistory = rotateHistory;
    persistHistory("rotateHistory", rotateHistory);
    renderRotateHistory();
  } else {
    historyRecords.unshift(record);
    if (historyRecords.length > 30) historyRecords.pop();
    persistHistory("historyRecords", historyRecords);
    renderHistory();
  }
}

function renderQuickHistory() {
  const el = document.getElementById("quickHistoryList");
  const card = document.getElementById("quickHistoryCard");
  if (!el) return;
  if (!quickHistory.length) {
    if (card) card.style.display = "none";
    el.innerHTML = "";
    return;
  }
  if (card) card.style.display = "";
  el.innerHTML = quickHistory.map((r, i) =>
    `<div class="card" style="margin-bottom:8px; padding:10px;">
      <div style="font-size:0.85rem; color:var(--text-dim);">${r.date || ""} ${r.day || ""}
        <span class="remove" style="float:right;" onclick="quickHistory.splice(${i},1);window.quickHistory=quickHistory;persistHistory('quickHistory',quickHistory);renderQuickHistory();">×</span>
      </div>
      <div>${(r.groups||[]).map(g => Array.isArray(g) ? g.join("、") : g).join(" | ")}</div>
      ${r.firstMatch ? `<div style="margin-top:4px; color:var(--accent);">${r.firstMatch}</div>` : ""}
    </div>`
  ).join("") + `<button type="button" class="secondary small" id="btnClearQuickHist" onclick="clearQuickHistory(this)" style="margin-top:8px;">清除快速分組紀錄</button>`;
}

function renderRotateHistory() {
  const el = document.getElementById("rotateHistoryList");
  if (!el) return;
  if (!rotateHistory.length) {
    el.innerHTML = `<span style="color:var(--text-dim)">尚無紀錄</span>`;
    return;
  }
  el.innerHTML = rotateHistory.map((r, i) =>
    `<div class="card" style="margin-bottom:8px; padding:10px;">
      <div style="font-size:0.85rem; color:var(--text-dim);">${r.date || ""} ${r.day || ""}
        <span class="remove" style="float:right;" onclick="rotateHistory.splice(${i},1);window.rotateHistory=rotateHistory;persistHistory('rotateHistory',rotateHistory);renderRotateHistory();">×</span>
      </div>
      <div>${(r.groups||[]).map(g => Array.isArray(g) ? g.join("、") : g).join(" | ")}</div>
      ${r.firstMatch ? `<div style="margin-top:4px; color:var(--accent);">${r.firstMatch}</div>` : ""}
    </div>`
  ).join("") + `<button type="button" class="secondary small" id="btnClearRotateHist" onclick="clearRotateHistory(this)" style="margin-top:8px;">清除單人輪轉紀錄</button>`;
}

function renderHistory() {
  const el = document.getElementById("historyList");
  if (!el) return;
  if (!historyRecords.length) {
    el.innerHTML = `<span style="color:var(--text-dim)">尚無紀錄</span>`;
    return;
  }
  el.innerHTML = historyRecords.map((r, i) =>
    `<div class="card" style="margin-bottom:8px; padding:10px;">
      <div style="font-size:0.85rem; color:var(--text-dim);">${r.date || ""} ${r.day || ""} ${r.type || ""}

function getCoverPartners() {
  const partners = {};
  coverNames.forEach(n => partners[n] = new Set());
  for (let i = 0; i <= coverStep && coverState; i++) {
    const groups = coverState[i];
    if (!groups) continue;
    groups.forEach(g => {
      for (let a = 0; a < g.length; a++) {
        for (let b = a + 1; b < g.length; b++) {
          if (partners[g[a]]) partners[g[a]].add(g[b]);
          if (partners[g[b]]) partners[g[b]].add(g[a]);
        }
      }
    });
  }
  return partners;
}

function startCover() {
  const n = parseInt(document.getElementById("coverCount").value, 10);
  if (coverPeople.length < n) {
    alert("目前只有 " + coverPeople.length + " 人，不足 " + n + " 人。請載入名單或手動新增。");
    return;
  }
  // take n people then shuffle so first round is random
  let pool = coverPeople.slice(0, n);
  for (let i = pool.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    const tmp = pool[i]; pool[i] = pool[j]; pool[j] = tmp;
  }
  coverNames = pool;
  coverState = generateCoverRounds(coverNames);
  coverStep = 0;
  coverTotal = coverState.length;
  showCoverStep();
  saveCoverHistory();
}

function generateCoverRounds(names) {
  const n = names.length;
  const rounds = [];
  
  if (n === 6) {
    const s = [[[0,1],[2,3],[4,5]],[[0,2],[1,4],[3,5]],[[0,3],[1,5],[2,4]],[[0,4],[1,3],[2,5]],[[0,5],[1,2],[3,4]]];
    s.forEach(r => rounds.push(r.map(p => [names[p[0]], names[p[1]]])));
  } else if (n === 7) {
    const s = [[[1,2],[3,4],[5,6]],[[0,2],[3,5],[4,6]],[[0,1],[3,6],[4,5]],[[0,4],[1,5],[2,6]],[[0,3],[1,6],[2,5]],[[0,6],[1,3],[2,4]],[[0,5],[1,4],[2,3]]];
    s.forEach(r => rounds.push(r.map(p => [names[p[0]], names[p[1]]])));
  } else if (n === 8) {
    for (let r = 0; r < 7; r++) {
      const others = Array.from({length:7}, (_,i) => (i + r) % 7 + 1);
      rounds.push([[names[0], names[others[0]]],[names[others[1]], names[others[6]]],[names[others[2]], names[others[5]]],[names[others[3]], names[others[4]]]]);
    }
  } else if (n === 9) {
    const s = [[[2,5],[3,6],[1,4],[7,8]],[[0,2],[5,6],[3,4],[7,8]],[[4,6],[5,7],[0,1],[3,8]],[[4,8],[1,2],[6,7],[0,5]],[[0,7],[1,8],[3,5],[2,6]],[[2,8],[4,7],[0,3],[1,5]],[[2,3],[1,6],[0,4],[5,8]],[[4,5],[1,7],[2,3],[0,6]],[[2,7],[6,8],[3,4],[1,5]],[[3,7],[0,8],[2,6],[4,5]]];
    s.forEach(r => rounds.push(r.map(p => [names[p[0]], names[p[1]]])));
  } else if (n === 10) {
    for (let r = 0; r < 9; r++) {
      const others = Array.from({length:9}, (_,i) => (i + r) % 9 + 1);
      rounds.push([[names[0], names[others[0]]],[names[others[1]], names[others[8]]],[names[others[2]], names[others[7]]],[names[others[3]], names[others[6]]],[names[others[4]], names[others[5]]]]);
    }
  }
  return rounds;
}

function hasConflict(group) {
  const names = group.map(p => p.name);
  if (document.getElementById("noFemalePair")?.checked) {
    const females = group.filter(p => p.gender === "女");
    if (females.length > 1) return true;
  }
  for (const pair of cannotPairs) {
    if (names.includes(pair.a) && names.includes(pair.b)) return true;
  }
  if (memoryEnabled) {
    for (const pair of historyPairs) {
      if (names.includes(pair.a) && names.includes(pair.b)) return true;
    }
  }
  return false;
}

function generate() {

  if (people.length < 2) { alert("請先新增人員"); return; }
  const groups = parseInt(document.getElementById("numGroups").value) || 0;
  const per = parseInt(document.getElementById("peoplePerGroup").value) || 0;
  const rounds = parseInt(document.getElementById("numRounds").value) || 1;
  const useBalance = document.getElementById("balanceLevel")?.checked;
  if (!groups && !per) { alert("請設定分組方式"); return; }
  const numGroups = groups || Math.ceil(people.length / per);

  let allRounds = [];
  for (let r = 0; r < rounds; r++) {
    let attempts = 0;
    let result;
    let best = null;
    let bestScore = Infinity;
    do {
      const shuffled = [...people].sort(() => Math.random() - 0.5);
      result = Array.from({length:numGroups}, () => []);
      shuffled.forEach((p,i) => result[i % numGroups].push(p));
      attempts++;
      if (useBalance && !result.some(hasConflict)) {
        const avgs = result.map(g => g.reduce((s,p) => s + (p.ability||0), 0) / (g.length||1));
        const score = Math.max(...avgs) - Math.min(...avgs);
        if (score < bestScore) { bestScore = score; best = result.map(g => [...g]); }
        if (score < 3 || attempts > 80) break;
      }
    } while (result.some(hasConflict) && attempts < 150);
    if (useBalance && best) result = best;
    if (attempts >= 150 && result.some(hasConflict)) { 
      alert("已分到不能再分\\n請取消勾選「同組過不能再同組」，再重新勾選後按開始分組"); 
      return; 
    }
    allRounds.push(result);
    if (memoryEnabled) {
      result.forEach(g => {
        for (let i = 0; i < g.length; i++) for (let j = i+1; j < g.length; j++) {
          historyPairs.push({a:g[i].name, b:g[j].name});
        }
      });
    }
  }

  currentManualResult = allRounds;
  let html = "";
  allRounds.forEach((result, ri) => {
    html += `<div style="margin-bottom:16px;"><strong>第 ${ri+1} 輪</strong><div class="groups-grid" style="margin-top:8px;">`;
    result.forEach((g, gi) => {
      const avg = g.length ? (g.reduce((s,p) => s + (p.ability||0), 0) / g.length).toFixed(1) : 0;
      html += `<div class="card" style="margin:0; padding:10px;"><strong>第 ${gi+1} 組 (${g.length}人)</strong>${useBalance ? ` <span style="color:var(--accent);">均${avg}</span>` : ""}<br>${g.map(p => p.name + (p.ability ? " ["+p.ability+"]" : "")).join("<br>")}</div>`;
    });
    html += `</div></div>`;
  });
  document.getElementById("result").innerHTML = html;

  const labels = Array.from({length:numGroups}, (_,i) => String.fromCharCode(65+i));
  const shuffledFirst = [...labels].sort(() => Math.random() - 0.5);
  currentManualFirst = labels.length >= 2 ? `先開打：${shuffledFirst[0]} 組 vs ${shuffledFirst[1]} 組` : "";
  document.getElementById("manualFirstArea").innerHTML = `<button class="secondary small" onclick="showManualFirst()">顯示哪組先打</button><div id="manualFirstText" class="hidden" style="margin-top:8px; padding:8px; background:#1e293b; border-radius:8px;"></div>`;

  updateMemoryInfo();
  saveManualToHistory(true);
}

      ${r.firstMatch ? `<div style="margin-top:4px; color:var(--accent);">${r.firstMatch}</div>` : ""}
    </div>
  `).join("") + `<button type="button" class="secondary small" id="btnClearManualHist" onclick="clearManualHistory(this)" style="margin-top:8px;">清除所有歷史</button>`;

function showFirst(btn) {
  const div = btn.nextElementSibling;
  div.classList.toggle("hidden");

  }
}

const groupColors = ["#3b82f6","#ef4444","#22c55e","#f59e0b","#a855f7","#06b6d4","#ec4899","#84cc16"];

function startQuick() {
  const total = parseInt(document.getElementById("quickTotal").value) || 6;
  const per = parseInt(document.getElementById("quickPerGroup").value) || 2;
  const numGroups = Math.ceil(total / per);
  const labels = "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("");
  const assignments = [];
  for (let g = 0; g < numGroups; g++) {
    for (let k = 0; k < per && assignments.length < total; k++) assignments.push(labels[g]);
  }
  for (let i = assignments.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [assignments[i], assignments[j]] = [assignments[j], assignments[i]];
  }
  quickAssignments = assignments;
  quickIndex = 0;
  document.getElementById("quickSetup").classList.add("hidden");
  document.getElementById("quickReveal").classList.remove("hidden");
  document.getElementById("curtainArea").classList.remove("hidden");
  resetCurtain();
  document.getElementById("quickStatus").textContent = `請第 1 位點一下確認組別（共 ${total} 人）`;
  document.getElementById("confirmArea").classList.add("hidden");
}

function resetCurtain() {
  const curtain = document.getElementById("curtain");
  curtain.style.display = "flex";
  document.getElementById("groupDisplay").style.visibility = "hidden";
  document.getElementById("confirmArea").classList.add("hidden");
}

function pullCurtain() {
  if (quickIndex >= quickAssignments.length) return;
  const label = quickAssignments[quickIndex];
  const color = groupColors[label.charCodeAt(0) - 65] || "#3b82f6";
  document.getElementById("quickGroup").textContent = label;
  document.getElementById("quickGroup").style.color = color;
  document.getElementById("quickHint").textContent = "組";
  document.getElementById("groupDisplay").style.visibility = "visible";
  document.getElementById("curtain").style.display = "none";
  document.getElementById("confirmArea").classList.remove("hidden");
  document.getElementById("quickStatus").textContent = `第 ${quickIndex+1} 位：${label} 組`;
  if (navigator.vibrate) navigator.vibrate(100);
}

function confirmNext() {
  quickIndex++;
  if (quickIndex >= quickAssignments.length) {
    showQuickResults();
    return;
  }
  resetCurtain();
  document.getElementById("quickStatus").textContent = `請第 ${quickIndex+1} 位點一下確認組別`;
}

function showQuickResults() {
  const groupsMap = {};
  quickAssignments.forEach((label, idx) => {
    if (!groupsMap[label]) groupsMap[label] = [];
    groupsMap[label].push(idx + 1);
  });
  const labels = Object.keys(groupsMap).sort();
  let html = `<div style="margin-top:12px;">`;
  labels.forEach(l => {
    const color = groupColors[l.charCodeAt(0) - 65] || "#3b82f6";
    html += `<div style="margin-bottom:6px;"><span style="color:${color}; font-weight:bold;">${l} 組</span>：第 ${groupsMap[l].join("、")} 位</div>`;
  });
  html += `</div>
    <button class="secondary small" style="margin-top:8px;" onclick="showFirstMatch(this)">顯示哪組先打</button>
    <div class="hidden" style="margin-top:8px; padding:8px; background:#1e293b; border-radius:8px;"></div>`;
  document.getElementById("quickStatus").innerHTML = "全部完成" + html;
  document.getElementById("confirmArea").classList.add("hidden");
  document.getElementById("curtainArea").classList.add("hidden");
  const groups = labels.map(l => [l + " 組", ...groupsMap[l].map(n => "第"+n+"位")]);
  const firstLabels = [...new Set(quickAssignments)].sort();
  const firstShuffled = [...firstLabels].sort(() => Math.random() - 0.5);
  window.currentQuickFirst = firstLabels.length >= 2 ? `先開打：${firstShuffled[0]} 組 vs ${firstShuffled[1]} 組` : "";
  saveHistory("快速分組", groups, window.currentQuickFirst);
}

}

let rotatePeople = [];
let rotateGroupsData = [];

function addRotatePerson() {

function renderRotatePeople() {

    `<span class="tag">${p.name}${p.gender?" ("+p.gender+")":""}${p.level?" ["+p.level+"]":""} <span class="remove" onclick="rotatePeople.splice(${i},1);renderRotatePeople();">×</span></span>`

function showManualRotateEditor() {
  const numGroups = parseInt(document.getElementById("rGroups").value) || 3;
  const per = Math.max(2, Math.ceil((rotatePeople.length || 6) / numGroups));
  let html = `<div style="margin-bottom:8px; color:var(--text-dim); font-size:0.9rem;">直接在各組填名字</div>`;

    for (let si = 0; si < per; si++) {
      html += `<input type="text" class="rotate-slot" data-g="${gi}" placeholder="名字" style="margin-top:6px; margin-bottom:0;">`;
    }
    html += `</div>`;
  }
  html += `<button type="button" onclick="applyManualRotateEditor()" style="width:100%;">確認手動分組</button>`;
  document.getElementById("rotateResult").innerHTML = html;
}

function applyManualRotateEditor() {
  const numGroups = parseInt(document.getElementById("rGroups").value) || 3;
  rotateGroupsData = Array.from({length: numGroups}, () => []);
  document.querySelectorAll(".rotate-slot").forEach(inp => {
    const g = parseInt(inp.dataset.g, 10);
    const name = (inp.value || "").trim();
    if (name) rotateGroupsData[g].push({ name, gender: "", level: "", fixed: false });
  });
  if (rotateGroupsData.every(g => g.length === 0)) {
    alert("請至少填一個名字");
    return;
  }
  // sync names into rotatePeople if missing
  rotateGroupsData.flat().forEach(p => {
    if (!rotatePeople.find(x => x.name === p.name)) rotatePeople.push({...p});
  });
  if (typeof renderRotatePeople === "function") renderRotatePeople();
  renderRotateGroups();
  const first = showRotateFirst();
  saveHistory("單人輪轉", rotateGroupsData.map(g => g.map(p => p.name)), first);
}

function confirmRotate() {
  if (rotatePeople.length < 2) { alert("請先新增人員"); return; }
  const numGroups = parseInt(document.getElementById("rGroups").value) || 3;
  const shuffled = [...rotatePeople].sort(() => Math.random() - 0.5);
  rotateGroupsData = Array.from({length:numGroups}, () => []);
  shuffled.forEach((p,i) => rotateGroupsData[i % numGroups].push({...p}));
  renderRotateGroups();
  const first = showRotateFirst();
  saveHistory("單人輪轉", rotateGroupsData.map(g => g.map(p => p.name)), first);
}

function renderRotateGroups() {
  document.getElementById("rotateResult").innerHTML = rotateGroupsData.map((g, gi) =>
    `<div class="card" style="margin-bottom:8px;">
      <strong>第${gi+1}組</strong><br>
      ${g.map((p, pi) => `<label style="display:inline-flex; align-items:center; margin-right:8px;"><input type="checkbox" ${p.fixed?"checked":""} onchange="rotateGroupsData[${gi}][${pi}].fixed=this.checked"> ${p.name}</label>`).join("")}
    </div>`
  ).join("");
}

function doRotate(dir) {
  if (!rotateGroupsData.length) return;
  const numGroups = rotateGroupsData.length;
  const movers = rotateGroupsData.map(g => g.filter(p => !p.fixed));
  const fixeds = rotateGroupsData.map(g => g.filter(p => p.fixed));
  if (dir === "cw") {
    for (let i = 0; i < numGroups; i++) {
      rotateGroupsData[i] = [...fixeds[i], ...(movers[(i - 1 + numGroups) % numGroups] || [])];
    }
  } else {
    for (let i = 0; i < numGroups; i++) {
      rotateGroupsData[i] = [...fixeds[i], ...(movers[(i + 1) % numGroups] || [])];
    }
  }
  renderRotateGroups();
  const first = showRotateFirst();
  saveHistory("單人輪轉", rotateGroupsData.map(g => g.map(p => p.name)), first);
}

function showRotateFirst() {
  const labels = rotateGroupsData.map((_,i) => String.fromCharCode(65+i));
  if (labels.length < 2) return;
  const shuffled = [...labels].sort(() => Math.random() - 0.5);
  const text = `先開打：${shuffled[0]} 組 vs ${shuffled[1]} 組`;
  document.getElementById("rotateFirst").innerHTML = `<div style="margin-top:8px; padding:8px; background:#1e293b; border-radius:8px;">${text}</div>`;
  return text;
}

function addString(i) {

function renderRackets() {

function breakString(i) {
  if (!rackets[i] || !rackets[i].strings.length) {

  const today = new Date().toISOString().slice(0,10);

let savedRosters = [];
let editingRosterId = null;

function loadRosters() {

}

function refreshRosterSelects() {

function applyRosterToManual(id) {
  if (!id) return;
  const r = savedRosters.find(x => x.id === id);
  if (!r) return;
  people = r.people.map(p => ({ name: p.name, gender: p.gender || "", ability: p.ability || "" }));

function persistRosters() {
  try { localStorage.setItem("savedRosters", JSON.stringify(savedRosters)); } catch(e) {}
}

function toggleRosterPanel() {
  const el = document.getElementById("rosterPanel");
  if (!el) return;
  el.classList.toggle("hidden");
  if (!el.classList.contains("hidden")) renderRosterList();
}

function parseRosterText(text) {
  return text.split(/\n+/).map(line => line.trim()).filter(Boolean).map(line => {
    const parts = line.split(/[,，\t]/).map(s => s.trim());
    const name = parts[0] || "";
    let gender = "", ability = "";
    if (parts[1] === "男" || parts[1] === "女") gender = parts[1];
    if (parts[2] && /^\d+$/.test(parts[2])) ability = parts[2];
    else if (parts[1] && /^\d+$/.test(parts[1])) ability = parts[1];
    return { name, gender, ability };
  }).filter(p => p.name);
}

function rosterToText(list) {
  return list.map(p => {
    let s = p.name;
    if (p.gender) s += "," + p.gender;
    if (p.ability) s += "," + p.ability;
    return s;
  }).join("\n");
}

function saveRoster() {
  const title = (document.getElementById("rosterNameInput").value || "").trim();
  const list = parseRosterText(document.getElementById("rosterTextInput").value || "");
  if (!title) { alert("請輸入名單名稱"); return; }
  if (!list.length) { alert("請輸入至少一個名字"); return; }
  if (savedRosters.some(r => r.name === title && r.id !== editingRosterId)) {
    alert("已有同名名單，請換名稱或按「更新目前編輯」");
    return;
  }
  const item = { id: Date.now().toString(36) + Math.random().toString(36).slice(2,6), name: title, people: list };
  savedRosters.unshift(item);
  persistRosters();
  editingRosterId = item.id;
  document.getElementById("rosterEditHint").textContent = "目前編輯：" + title;
  renderRosterList();
  alert("已存檔：「" + title + "」共 " + list.length + " 人");
}

function updateRoster() {
  if (!editingRosterId) { alert("請先點某份名單的「編輯」，或先「存成名單」"); return; }
  const title = (document.getElementById("rosterNameInput").value || "").trim();
  const list = parseRosterText(document.getElementById("rosterTextInput").value || "");
  if (!title) { alert("請輸入名單名稱"); return; }
  if (!list.length) { alert("請輸入至少一個名字"); return; }
  const idx = savedRosters.findIndex(r => r.id === editingRosterId);
  if (idx < 0) { alert("找不到要更新的名單"); return; }
  if (savedRosters.some(r => r.name === title && r.id !== editingRosterId)) {
    alert("已有同名名單");
    return;
  }
  savedRosters[idx] = { ...savedRosters[idx], name: title, people: list };
  persistRosters();
  document.getElementById("rosterEditHint").textContent = "目前編輯：" + title;
  renderRosterList();
  alert("已更新：「" + title + "」");
}

function importFromPeople() {
  if (!people.length) { alert("目前手動名單是空的"); return; }
  document.getElementById("rosterTextInput").value = rosterToText(people);
}

function loadRoster(id) {
  const r = savedRosters.find(x => x.id === id);
  if (!r) return;
  people = r.people.map(p => ({ name: p.name, gender: p.gender || "", ability: p.ability || "" }));
  renderPeople();
  updateSelects();
  // also fill rotate list for convenience
  rotatePeople = r.people.map(p => ({ name: p.name, gender: p.gender || "", level: p.ability || "", fixed: false }));
  if (typeof renderRotatePeople === "function") renderRotatePeople();
  alert("已載入「" + r.name + "」共 " + people.length + " 人到手動／單人輪轉");
}

function editRoster(id) {
  const r = savedRosters.find(x => x.id === id);
  if (!r) { alert("找不到此名單"); return; }
  editingRosterId = id;
  document.getElementById("rosterNameInput").value = r.name;
  document.getElementById("rosterTextInput").value = rosterToText(r.people);
  document.getElementById("rosterEditHint").textContent = "目前編輯：" + r.name + "（可改完按更新）";
  document.getElementById("rosterPanel").classList.remove("hidden");
  document.getElementById("rosterNameInput").scrollIntoView({ behavior: "smooth", block: "center" });
}

function deleteRoster(id, btn) {
  const r = savedRosters.find(x => x.id === id);
  if (!r) {
    alert("找不到此名單");
    return;
  }
  if (btn && btn.dataset.confirm !== "1") {
    btn.dataset.confirm = "1";
    btn.textContent = "確認?";
    setTimeout(function() {
      if (btn.dataset.confirm === "1") {
        btn.dataset.confirm = "";
        btn.textContent = "刪";
      }
    }, 3000);
    return;
  }
  savedRosters = savedRosters.filter(x => x.id !== id);
  if (editingRosterId === id) {
    editingRosterId = null;
    const hint = document.getElementById("rosterEditHint");
    if (hint) hint.textContent = "";
  }
  persistRosters();
  renderRosterList();
}

function renderRosterList() {
  const el = document.getElementById("rosterList");
  if (!el) return;
  if (!savedRosters.length) {
    el.innerHTML = '<span style="color:var(--text-dim); font-size:0.9rem;">尚無已存名單</span>';
    return;
  }
  el.innerHTML = savedRosters.map(r =>
    `<div class="roster-row" data-id="${r.id}" style="display:flex; align-items:center; gap:6px; flex-wrap:wrap; padding:8px 0; border-bottom:1px solid var(--border);">
      <button type="button" data-act="load" style="flex:1; text-align:left;">${r.name}（${r.people.length}人）</button>
      <button type="button" class="secondary small" data-act="edit">編輯</button>
      <button type="button" class="secondary small" data-act="del" style="background:#ef4444;">刪</button>
    </div>`
  ).join("");
  refreshRosterSelects();
  el.onclick = function(ev) {
    const btn = ev.target.closest("button[data-act]");
    if (!btn) return;
    ev.preventDefault();
    ev.stopPropagation();
    const row = btn.closest(".roster-row");
    if (!row) return;
    const id = row.getAttribute("data-id");
    const act = btn.getAttribute("data-act");
    if (act === "load") loadRoster(id);
    else if (act === "edit") editRoster(id);
    else if (act === "del") deleteRoster(id, btn);
  };
}


const APP_VERSION = "1.3.5";

async function checkUpdate() {
  const btn = document.querySelector('button[onclick="checkUpdate()"]');
  if (btn) { btn.disabled = true; btn.textContent = "檢查中…"; }
  try {
    if ("caches" in window) {
      const keys = await caches.keys();
      await Promise.all(keys.map(k => caches.delete(k)));
    }
    if ("serviceWorker" in navigator) {
      const regs = await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.map(r => r.unregister()));
    }
    const url = location.href.split("?")[0].split("#")[0] + "?_=" + Date.now();
    const res = await fetch(url, { cache: "no-store" });
    const text = await res.text();
    const m = text.match(/APP_VERSION\s*=\s*["']([^"']+)["']/);
    const remote = m ? m[1] : null;
    if (remote && remote !== APP_VERSION) {
      if (confirm("發現新版本 v" + remote + "（目前 v" + APP_VERSION + "）\n是否重新載入？")) {
        location.replace(location.href.split("?")[0].split("#")[0] + "?v=" + remote);
        return;
      }
    } else {
      alert("已是最新版本 v" + APP_VERSION + "\n將重新載入以套用最新檔案。");
      location.reload();
      return;
    }
  } catch (e) {
    if (confirm("檢查失敗，是否強制重新載入？")) location.reload();
  } finally {
    if (btn) { btn.disabled = false; btn.textContent = "檢查更新"; }
  }
}

});
